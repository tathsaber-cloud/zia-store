<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZiA | متجر الهوديز العصري</title>
<meta name="description" content="هوديز ZiA بتصميم عصري وخامة مريحة. اختار اللون والمقاس واطلب بسهولة.">
<style>
:root {
  --bg-color: #0b0e14;
  --card-bg: #161b22;
  --accent-color: #e63946;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --border-color: #262c36;
  --btn-hover: #ff4d5e;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: Arial, Tahoma, sans-serif;
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  width: min(1200px, 92%);
  margin: auto;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 14, 20, 0.9);
  border-bottom: 1px solid var(--border-color);
  backdrop-filter: blur(10px);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
}

.head-logo img {
  width: 55px;
  height: 55px;
  object-fit: contain;
  border-radius: 50%;
  border: 2px solid var(--accent-color);
}

.links {
  display: flex;
  gap: 25px;
  font-size: 15px;
  font-weight: 500;
}

.links a:hover {
  color: var(--accent-color);
}

.iconbtn {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 22px;
  cursor: pointer;
  position: relative;
}

.cart-head span {
  font-size: 11px;
  background: var(--accent-color);
  color: white;
  border-radius: 50%;
  padding: 2px 6px;
  position: absolute;
  top: -5px;
  right: -8px;
}

/* Hero Section */
.hero {
  padding: 60px 0;
  border-bottom: 1px solid var(--border-color);
  background: radial-gradient(circle at 80% 20%, #1e2633 0%, var(--bg-color) 70%);
}

.hero-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 30px;
}

.hero-copy h1 {
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.2;
  margin-bottom: 15px;
  font-weight: 800;
}

.hero-copy h1 span {
  color: var(--accent-color);
}

.hero-copy p {
  color: var(--text-muted);
  font-size: 16px;
  margin-bottom: 25px;
  max-width: 480px;
}

.cta {
  display: inline-block;
  background: var(--accent-color);
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta:hover {
  background: var(--btn-hover);
  transform: translateY(-2px);
}

.hero-art {
  display: flex;
  justify-content: center;
}

.product-art-img {
  width: 100%;
  max-width: 400px;
  border-radius: 16px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  border: 1px solid var(--border-color);
}

/* Products Section */
section {
  padding: 50px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.section-head h2 {
  font-size: 26px;
  border-right: 4px solid var(--accent-color);
  padding-right: 12px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 15px;
  transition: 0.3s;
}

.card:hover {
  border-color: var(--accent-color);
  transform: translateY(-4px);
}

.card-img-wrap {
  width: 100%;
  height: 250px;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  margin-bottom: 12px;
}

.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  color: var(--accent-color);
}

.button {
  background: var(--accent-color);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  width: 100%;
  margin-top: 10px;
}

.button:hover {
  background: var(--btn-hover);
}

/* Footer */
footer {
  background: #07090d;
  border-top: 1px solid var(--border-color);
  padding: 30px 0;
  color: var(--text-muted);
  font-size: 14px;
}

.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

@media(max-width: 768px) {
  .hero-inner {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .hero-copy p {
    margin: 0 auto 25px;
  }
  .links {
    display: none;
  }
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="head-logo" href="#home">
      <img src="watermarked_img_0.png" alt="ZiA Logo">
    </a>
    <nav class="links">
      <a href="#home">الرئيسية</a>
      <a href="#products">المنتجات</a>
      <a href="#about">من نحن</a>
    </nav>
    <div class="head-actions">
      <button class="iconbtn cart-head">🛒 <span>0</span></button>
    </div>
  </div>
</header>

<section class="hero" id="home">
  <div class="wrap hero-inner">
    <div class="hero-copy">
      <h1>تشكيلة <span>ZiA</span> الجديدة للهوديز</h1>
      <p>تصاميم عصرية خرافية وخامات قطنية مريحة تناسب إطلالتك اليومية.</p>
      <a href="#products" class="cta">تسوق الآن</a>
    </div>
    <div class="hero-art">
      <img src="watermarked_img_0.png" alt="ZiA Hoodie Spec" class="product-art-img">
    </div>
  </div>
</section>

<section class="wrap" id="products">
  <div class="section-head">
    <h2>أحدث الهوديز</h2>
  </div>
  <div class="products">
    
    <!-- Card 1 -->
    <div class="card">
      <div class="card-img-wrap">
        <img src="watermarked_img_0.png" alt="ZiA Black Hoodie">
      </div>
      <h3>هودي ZiA اسود كلاسيك</h3>
      <div class="price-row">
        <span class="price">450 ج.م</span>
      </div>
      <button class="button">أضف للسلة</button>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="card-img-wrap">
        <img src="watermarked_img_0.png" alt="ZiA Red Edition">
      </div>
      <h3>هودي ZiA أحمر عصري</h3>
      <div class="price-row">
        <span class="price">480 ج.م</span>
      </div>
      <button class="button">أضف للسلة</button>
    </div>

  </div>
</section>

<footer>
  <div class="wrap foot">
    <div>جميع الحقوق محفوظة &copy; 2026 ZiA Store</div>
    <div>تصميم عصري وجذاب</div>
  </div>
</footer>

</body>
</html>
