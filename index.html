<style>
:root{--bg:#ffffff;--panel:#ffffff;--blue:#1687ee;--white:#172331;--muted:#68798a;--line:#e4edf5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#172331;font-family:Arial,Tahoma,sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:5;background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}.logo{font-size:36px;font-weight:900;direction:ltr;letter-spacing:-2px}.logo span{color:var(--blue)}.links{display:flex;gap:22px;color:#26384a;font-size:14px}.links a:hover{color:var(--blue)}.navbtn{border:1px solid #d8e9f8;border-radius:10px;background:#f1f8ff;color:#1769ad;padding:9px 13px}
.hero{overflow:hidden;position:relative;background:radial-gradient(ellipse at 78% 45%,#e5f3ff 0,transparent 36%),linear-gradient(115deg,#ffffff,#f8fbff 65%,#eef7ff);border-bottom:1px solid var(--line)}.hero-inner{min-height:370px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:38px 0}.eyebrow{letter-spacing:5px;color:#4385bd;font-size:12px;direction:ltr;text-align:right}.hero h1{font-size:clamp(36px,6vw,66px);line-height:1.15;margin:12px 0}.blue{color:var(--blue)}.hero p{color:#526476;max-width:470px}.cta,.button{display:inline-block;background:var(--blue);color:white;border:0;border-radius:10px;padding:12px 23px;font-weight:bold;cursor:pointer}.hero-art{min-height:270px;display:flex;align-items:center;justify-content:center;position:relative}.hoodie-placeholder{width:min(350px,100%);aspect-ratio:1/1.05;border-radius:30px;background:linear-gradient(145deg,#e9f5ff,#ffffff 60%);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 45px #1c5b8a18;border:1px solid #d9eafa;position:relative;overflow:hidden}.hoodie-placeholder:before{content:"";position:absolute;width:220px;height:270px;background:linear-gradient(120deg,#303640,#090b0f 65%);border-radius:45% 45% 18% 18%;box-shadow:inset 8px 0 15px #ffffff10, inset -12px 0 20px #000}.hoodie-placeholder:after{content:"";position:absolute;top:35px;width:90px;height:75px;border:12px solid #090b0f;border-bottom:0;border-radius:50% 50% 0 0;z-index:1}.hoodie-mark{position:relative;z-index:2;font-size:28px;font-weight:900;direction:ltr;text-shadow:0 2px 8px #000}.hoodie-mark span{color:var(--blue)}.spark{position:absolute;color:var(--blue);font-size:55px;opacity:.6;top:8px;right:12px}
section{padding:38px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.section-head h2{margin:0;font-size:25px}.section-head h2:before{content:"";display:inline-block;width:28px;height:4px;background:var(--blue);margin-left:10px;vertical-align:middle}.hint{color:var(--muted);font-size:13px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(160deg,#ffffff,#f9fcff);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;box-shadow:0 8px 24px #0a5b9810}.product-art{height:210px;border-radius:10px;background:radial-gradient(ellipse at 50% 40%,#f0f8ff,#f8fbff 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.product-art .hoodie-placeholder{width:90%;height:95%;min-height:0;border:0;background:transparent;box-shadow:none;border-radius:0}.product-art .hoodie-placeholder:before{width:145px;height:175px}.product-art .hoodie-placeholder:after{top:28px;width:54px;height:48px;border-width:8px}.product-art .hoodie-mark{font-size:19px}.badge{position:absolute;top:10px;right:10px;background:var(--blue);border-radius:20px;padding:2px 10px;font-size:11px}.card h3{font-size:16px;margin:12px 0 3px}.price{font-weight:bold;font-size:18px}.old{color:#8190a0;text-decoration:line-through;font-size:13px;margin-right:7px}.colors{display:flex;gap:8px;margin:9px 0}.swatch{width:17px;height:17px;border-radius:50%;border:2px solid #8092a5;cursor:pointer}.sizes{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.size{border:1px solid #344657;color:#26384a;background:#ffffff;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}.size.selected{border-color:var(--blue);background:#063c70}.card .button{width:100%;padding:10px;margin-top:6px}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;border-block:1px solid var(--line);background:#f6fbff}.feature{text-align:center;padding:18px 8px}.feature strong{display:block;color:var(--blue);font-size:25px}.feature small{color:var(--muted)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.about-box{min-height:210px;border-radius:14px;background:radial-gradient(circle at 60% 45%,#e2f2ff,#ffffff 65%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}.about-box .logo{font-size:80px}.about p{color:#526476}
.order{background:linear-gradient(145deg,#ffffff,#f6fbff);border:1px solid var(--line);border-radius:16px;padding:22px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;color:#53697d;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;background:#ffffff;color:#172331;border:1px solid #d5e3ef;border-radius:9px;font:inherit}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.order .button{width:100%;margin-top:14px}.note{color:#68798a;font-size:12px;margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:24px 0;color:#68798a;font-size:13px;background:#fbfdff}.owner-tag{display:inline-block;margin-top:12px;padding:8px 13px;border:1px solid #1687ee;border-radius:10px;background:#eef7ff;color:#155fa8;font-size:13px;font-weight:700;letter-spacing:.2px;box-shadow:0 3px 10px rgba(22,135,238,.12)}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.foot .logo{font-size:25px}

/* Product detail and cart flow */
.view{display:none;min-height:70vh;padding:26px 0 90px}.view.active{display:block}.backbtn{border:1px solid var(--line);background:#f5faff;color:#1769ad;padding:9px 14px;border-radius:9px;cursor:pointer;margin-bottom:18px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.gallery-main{height:390px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(ellipse at 50% 45%,#eaf6ff,#f9fcff 72%);display:flex;align-items:center;justify-content:center;overflow:hidden}.gallery-thumbs{display:flex;gap:10px;margin-top:10px}.thumb{height:80px;flex:1;border:1px solid var(--line);border-radius:10px;background:#f2f8ff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}.thumb.active{border:2px solid var(--blue)}.detail-info h1{margin:0 0 8px;font-size:30px}.detail-price{font-size:26px;font-weight:bold;margin:10px 0}.detail-info p{color:var(--muted)}.option-title{font-weight:bold;margin:18px 0 8px}.option-row{display:flex;gap:8px;flex-wrap:wrap}.option-chip{border:1px solid #cddbe7;background:white;border-radius:8px;padding:9px 14px;cursor:pointer}.option-chip.selected{border:2px solid var(--blue);background:#eef7ff;color:#075a9d}.color-chip{width:30px;height:30px;border-radius:50%;border:2px solid #aab8c5;cursor:pointer}.color-chip.selected{outline:3px solid #1687ee;outline-offset:2px}.qty-control{display:flex;align-items:center;gap:15px;margin:18px 0}.qty-control button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:white;font-size:20px;cursor:pointer}.detail-add{width:100%;margin-top:10px}.cart-float{position:fixed;bottom:18px;left:18px;z-index:20;border:0;border-radius:999px;background:var(--blue);color:white;padding:13px 18px;font-size:16px;font-weight:bold;box-shadow:0 8px 28px #1687ee55;cursor:pointer}.cart-count{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#1687ee;border-radius:50%;min-width:23px;height:23px;margin-right:6px;font-size:12px}.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-mini{height:70px;background:#f0f8ff;border-radius:9px;display:flex;align-items:center;justify-content:center}.cart-item h3{margin:0;font-size:15px}.cart-item p{margin:2px 0;color:var(--muted);font-size:13px}.remove-item{border:0;background:#fff0f0;color:#c33;border-radius:8px;padding:7px;cursor:pointer}.cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;margin:18px 0}.empty{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:760px){.detail-grid{grid-template-columns:1fr;gap:18px}.gallery-main{height:310px}.detail-info h1{font-size:25px}.cart-float{bottom:12px;left:12px}.cart-item{grid-template-columns:58px 1fr auto}.cart-mini{height:58px}}

@media(max-width:760px){.links{display:none}.hero-inner{grid-template-columns:1fr;padding:26px 0}.hero-copy{order:1}.hero-art{order:0;min-height:210px}.hero-art .hoodie-placeholder{width:220px}.hero h1{font-size:42px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-art{height:165px}.card{padding:9px}.card h3{font-size:14px}.price{font-size:16px}.features{grid-template-columns:repeat(2,1fr)}.about{grid-template-columns:1fr}.order-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.section-head h2{font-size:22px}}

.logo-intro{display:flex;justify-content:center;align-items:center;padding:18px 12px 10px;background:#fff;border-bottom:1px solid var(--line)}.logo-intro img{display:block;width:min(230px,62vw);height:auto;object-fit:contain;border-radius:50%}

:root{--blue:#2866b9;--line:#e1e6ee;--muted:#65758b}
